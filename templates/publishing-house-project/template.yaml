apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: publishing-house-project
  title: Publishing House Content Project
  description: Create a new PH content project with orchestrated workflow
  tags:
    - publishing-house
    - lab
    - devspaces

spec:
  owner: rhdp-team
  type: service

  parameters:
    - title: Onboarding Request
      required:
        - asset_title
        - project_description
        - content_outline
        - learning_objectives
        - content_type
      properties:
        asset_title:
          title: Asset Title
          type: string
          description: Name for your lab/demo
          ui:autofocus: true
          ui:placeholder: "OpenShift AI Workshop"
          ui:help: This will be the display name in the catalog

        project_description:
          title: Description / Abstract
          type: string
          description: What is this asset and why is it needed? High-level but clear.
          ui:widget: textarea
          ui:options:
            rows: 4
          ui:placeholder: "A hands-on lab teaching developers how to deploy and manage AI workloads on OpenShift using RHOAI"

        content_outline:
          title: Content Outline
          type: string
          description: Rough outline of the modules or sections. Doesn't need to be final — just show the shape of what you're building.
          ui:widget: textarea
          ui:options:
            rows: 8
          ui:placeholder: "Module 1: Introduction to OpenShift AI\nModule 2: Deploying ML Models\nModule 3: Managing Training Workloads"

        learning_objectives:
          title: Learning Objectives
          type: string
          description: What will participants learn or be able to do? Draft quality is fine.
          ui:widget: textarea
          ui:options:
            rows: 6
          ui:placeholder: "- Deploy and manage AI/ML workloads on OpenShift\n- Configure RHOAI for production use\n- Implement MLOps best practices"

        content_type:
          title: Lab or Demo?
          type: string
          enum: [lab, demo]
          enumNames: [Lab, Demo]
          default: lab

        associated_opportunities:
          title: Associated Opportunities
          type: string
          description: Is this associated with any specific opportunities, projects, or marketing campaigns? N/A is acceptable.
          ui:widget: textarea
          ui:options:
            rows: 3

        sales_play_tdp:
          title: Sales Play / TDP Relevance
          type: string
          description: Which TDP, Sales Play, and/or Sales Tactic is this most relevant to?
          ui:widget: textarea
          ui:options:
            rows: 3

        ai_related:
          title: Is this related to AI?
          type: boolean
          default: false

        partners_access:
          title: Should it be available to Partners?
          type: boolean
          default: false
          ui:help: Check if this content should be accessible to Red Hat partners

      dependencies:
        ai_related:
          oneOf:
            - properties:
                ai_related:
                  const: false
            - properties:
                ai_related:
                  const: true
                gpu_needed:
                  title: Do you need direct GPU access?
                  type: boolean
                  default: false
                  ui:help: Check if GPU hardware is required
              dependencies:
                gpu_needed:
                  oneOf:
                    - properties:
                        gpu_needed:
                          const: false
                    - properties:
                        gpu_needed:
                          const: true
                        maas_instead:
                          title: Can you use MaaS instead?
                          type: boolean
                          default: false
                          ui:help: Check if Model-as-a-Service can substitute for GPU

    - title: Project Setup
      required:
        - project_name
        - github_users
        - tags
      properties:
        project_name:
          title: Project Name (slug)
          type: string
          description: Repository name (letters, numbers, hyphens only)
          ui:placeholder: "openshift-ai-workshop"
          pattern: '^[a-z0-9-]+$'
          ui:help: Use lowercase letters, numbers, and hyphens only

        github_users:
          title: GitHub Collaborators
          type: array
          minItems: 0
          ui:help: "Add GitHub usernames for collaborators (optional). Your account is added automatically as owner."
          ui:options:
            addable: true
            orderable: false
            removable: true
          items:
            type: object
            required:
              - user
            properties:
              user:
                title: GitHub Username
                type: string
                ui:placeholder: "github-username"
              access:
                title: Access
                type: string
                default: push
                enum: ["push", "pull", "admin", "maintain", "triage"]
                ui:widget: hidden

        tags:
          title: Tags
          type: array
          ui:options:
            addable: true
            orderable: false
            removable: true
          items:
            type: string
            title: Tag
            pattern: "^[a-zA-Z0-9_-]+$"
            ui:placeholder: "e.g. openshift"
          ui:help: "One tag per entry — letters, numbers, hyphens, underscores only"

    - title: Initiative & Technical Details
      required:
        - initiative_key
        - showroom_type
        - automation_type
        - cloud_provider
        - cluster_type
        - ocp_version
      properties:
        initiative_key:
          title: Initiative
          type: string
          enum:
            - rh1_2027
            - summit_2027
            - none
          enumNames:
            - RH1 2027
            - Summit 2027
            - None
          default: rh1_2027
          ui:help: Which initiative is this content for?

        showroom_type:
          title: Showroom Type
          type: string
          enum:
            - classic
            - zero_touch
          enumNames:
            - Classic (standard Showroom)
            - Zero Touch (embedded automation)
          default: classic
          ui:help: Classic = standard Showroom lab. Zero Touch = embedded runtime/setup automation.

        automation_type:
          title: Automation Type
          type: string
          enum:
            - ansible
            - gitops
            - both
          enumNames:
            - Ansible
            - GitOps
            - Both (Ansible + GitOps)
          default: ansible
          ui:help: What type of automation will this project use?

        cloud_provider:
          title: Cloud Provider
          type: string
          enum:
            - cnv
            - aws
            - azure
          enumNames:
            - CNV (Default)
            - AWS
            - Azure
          default: cnv
          ui:help: Where will this run?

        cluster_type:
          title: Cluster Type
          type: string
          enum:
            - sno
            - multinode
          enumNames:
            - SNO (Single Node)
            - Multinode
          default: sno

        ocp_version:
          title: OCP Version
          type: string
          enum:
            - "4.20"
            - "4.21"
            - "4.22"
          enumNames:
            - "4.20"
            - "4.21"
            - "4.22"
          default: "4.21"
          ui:help: Minimum OpenShift version

  steps:
    # Step 1: Check if project name is already taken
    - id: check-catalog
      name: Check Project Name Availability
      action: catalog:fetch
      input:
        entityRef: component:default/${{ parameters.project_name }}
        optional: true

    # Step 2: Start workflow via central API (NO repo creation - happens after pre-intake approval)
    - id: trigger-workflow
      name: Start Publishing House Workflow
      if: ${{ steps['check-catalog'].output.entity == null }}
      action: http:backstage:request
      input:
        method: POST
        path: '/proxy/central-api/projects/${{ parameters.project_name }}/start'
        headers:
          content-type: 'application/json'
        body:
          projectId: ${{ parameters.project_name }}
          deploymentMode: rhdp_published
          ssoUser: ${{ user.entity.metadata.name }}
          ssoEmail: ${{ user.entity.spec.profile.email }}
          assetTitle: ${{ parameters.asset_title }}
          projectDescription: ${{ parameters.project_description }}
          contentOutline: ${{ parameters.content_outline }}
          learningObjectives: ${{ parameters.learning_objectives }}
          contentType: ${{ parameters.content_type }}
          associatedOpportunities: ${{ parameters.associated_opportunities }}
          salesPlayTdp: ${{ parameters.sales_play_tdp }}
          aiRelated: ${{ parameters.ai_related }}
          gpuNeeded: ${{ parameters.gpu_needed }}
          maasInstead: ${{ parameters.maas_instead }}
          partnersAccess: ${{ parameters.partners_access }}
          cloudProvider: ${{ parameters.cloud_provider }}
          clusterType: ${{ parameters.cluster_type }}
          ocpVersion: ${{ parameters.ocp_version }}
          automationType: ${{ parameters.automation_type }}
          showroomType: ${{ parameters.showroom_type }}
          initiativeKey: ${{ parameters.initiative_key }}
          teamMembers: ${{ parameters.github_users }}
          tags: ${{ parameters.tags }}
          intakeType: new
          phGitRef: ${{ environment.parameters.phGitRef }}

  output:
    links:
      - title: View Workflow Status
        icon: dashboard
        url: /publishing-house/projects/${{ parameters.project_name }}
        if: ${{ steps['check-catalog'].output.entity == null }}

      - title: View Jira Epic
        icon: docs
        url: ${{ steps['trigger-workflow'].output.body.jira_url }}
        if: ${{ steps['check-catalog'].output.entity == null && steps['trigger-workflow'].output.body.jira_url }}

      - title: View Existing Entity in Catalog
        icon: catalog
        url: /catalog/default/component/${{ parameters.project_name }}
        if: ${{ steps['check-catalog'].output.entity != null }}

    text:
      - title: Result
        content: |
          {% if steps['check-catalog'].output.entity %}
          **Scaffolding Skipped**

          A project named **"${{ parameters.project_name }}"** already exists in the catalog. All steps were skipped — no repository was created and no workflow was started. Re-run the template with a different project name.
          {% else %}
          **Your Publishing House project is live!** You're ready to start building.

          **Here's what we set up for you:**
          1. Repository created
          2. catalog-info.yaml added to repository
          3. Registered in Developer Hub catalog
          4. Orchestrator workflow started — your AI-guided content pipeline is running!

          **What happens next:**
          Claude will walk you through the entire content lifecycle — from intake and spec creation, through Jira tracking and reviews, all the way to a published lab on RHDP. Just follow the prompts!

          **Getting Started:**

          **DevSpaces (recommended):**
          1. Click the **Open in DevSpaces** link above
          2. Use Claude via the **extension** or the **CLI**:
             - **Extension:** Click the **Claude** icon in the sidebar, click **New Session**. If the Claude icon is not visible, open **Extensions** (`Ctrl/Cmd+Shift+X`), find **Claude Code for VS Code** under the DevSpaces section, click it, then click **Enable (Workspace)**.
             - **CLI:** Open a terminal and run `claude`
          3. Run `/rhdp-publishing-house` — and you're off!

          **Local machine:**
          1. Install the skills: `git clone -b ${{ environment.parameters.phGitRef }} https://github.com/rhpds/rhdp-publishing-house-skills.git ~/.claude/skills/publishing-house`
          2. Clone the repo: `git clone https://github.com/rhpds/${{ parameters.project_name }}`
          3. `cd ${{ parameters.project_name }}`
          4. Start Claude CLI: `claude`
          5. Run `/rhdp-publishing-house` — and you're off!
          {% endif %}
